# Keeps the free Render instance warm so the first tap of the day isn't a 30-second wait.
#
# A free Render web service spins down after ~15 minutes without traffic. This
# workflow pokes the health endpoint every 10 minutes from GitHub's runners, which
# is free for public repositories. It does not stop Render from restarting the
# service during a deploy (the demo catalogue re-seeds itself when that happens).
#
# When the service moves to a paid plan this file can be deleted.

name: keep-alive

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes
  workflow_dispatch:          # and on demand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping BUYBUDDY
        run: |
          URL="https://buybuddy-805j.onrender.com/api/health"
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -m 60 -w '%{http_code}' "$URL" || echo 000)
            echo "attempt $attempt -> HTTP $code"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 20
          done
          echo "::warning::BUYBUDDY did not answer after three attempts (last HTTP $code). The service may be deploying."
          exit 0
